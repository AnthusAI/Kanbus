project_directory: project
ignore_paths:
  - features/project
console_port: 4242
project_key: kbs
name: Kanbus

hierarchy:
  - initiative
  - epic
  - task
  - sub-task
types:
  - bug
  - story
  - chore
  - event

workflows:
  default:
    backlog: [open, closed]
    open: [in_progress, closed, backlog]
    in_progress: [open, review, blocked, closed, backlog]
    review: [in_progress, closed]
    blocked: [in_progress, closed, backlog]
    closed: [open, backlog]
    Discovery: [open, backlog]
  epic:
    open: [in_progress, closed]
    in_progress: [open, review, closed]
    review: [in_progress, closed]
    closed: [open]

statuses:
  - key: backlog
    name: Backlog
    category: To do
    semantic_category: todo
    collapsed: true
  - key: Discovery
    name: Discovery
    category: To do
    semantic_category: todo
    collapsed: false
  - key: open
    name: Ready
    category: To do
    semantic_category: todo
  - key: in_progress
    name: In Progress
    category: In progress
    semantic_category: in_progress
  - key: review
    name: Review
    category: In progress
    semantic_category: in_progress
    collapsed: true
  - key: blocked
    name: Blocked
    category: In progress
    semantic_category: in_progress
    collapsed: true
  - key: closed
    name: Done
    category: Done
    semantic_category: done
    collapsed: true

categories:
  - name: To do
    color: grey
  - name: In progress
    color: blue
  - name: Done
    color: green

transition_labels:
  default:
    backlog:
      open: Start discovery
      closed: Drop
    open:
      in_progress: Start work
      closed: Drop
      backlog: Back to backlog
    in_progress:
      open: Pause
      review: Ready for review
      blocked: Block
      closed: Complete
      backlog: Back to backlog
    review:
      in_progress: Request changes
      closed: Approve and close
    blocked:
      in_progress: Unblock
      closed: Drop
      backlog: Back to backlog
    closed:
      open: Reopen
      backlog: Back to backlog
    Discovery:
      open: Start work
      backlog: Back to backlog
  epic:
    open:
      in_progress: Start
      closed: Complete
    in_progress:
      open: Pause
      review: Ready for review
      closed: Complete
    review:
      in_progress: Request changes
      closed: Complete
    closed:
      open: Reopen

initial_status: open
priorities:
  0:
    name: critical
    color: red
  1:
    name: high
    color: bright_red
  2:
    name: medium
    color: yellow
  3:
    name: low
    color: blue
  4:
    name: trivial
    color: white
default_priority: 2

type_colors:
  initiative: bright_blue
  epic: magenta
  task: blue
  sub-task: bright_cyan
  bug: red
  story: yellow
  chore: green
  event: bright_blue

beads_compatibility: false

# AI provider for summarization (full summaries and right-now summaries).
# Right-now summaries use GPT 5.6 Luna, pinned via right_now.model.
ai:
  provider: litellm
  model: gpt-5.6-luna

# Right-now summary configuration. model is pinned to GPT 5.6 Luna so the
# frequent right-now tier stays on Luna even if ai.model changes for full
# summaries. Other fields use defaults (enabled, collapsed tree, 120 chars).
right_now:
  model: gpt-5.6-luna

coordination:
  providers: [git]
  contention_window: 5s
  default_lease_ttl: 300s

realtime:
  transport: mqtt
  broker: auto
  autostart: false
  keepalive: false
  uds_socket_path: null
  mqtt_custom_authorizer_name: null
  mqtt_api_token: null
  topics:
    project_events: projects/anthus/Kanbus/events

# Single-worker production smoke test. Flex is requested explicitly in the
# Codex profile and must be validated against the installed Codex runtime.
router:
  workflow:
    pending: open
    active: in_progress
    review: review
    blocked: blocked
    terminal: [closed]
  limits:
    project_wip: 10
    review_wip: 2
    class_wip:
      implementation: 1
      value: 1
      smart: 1
    provider_wip:
      codex-luna-flex: 1
  providers:
    codex-luna-flex:
      adapter: codex
      command: codex
      args: [--model, gpt-5.6-luna, -c, 'service_tier="flex"']
    codex-value:
      adapter: codex
      command: codex
      args: [--profile, value]
    codex-smart:
      adapter: codex
      command: codex
      args: [--profile, smart]
  classes:
    implementation:
      providers: [codex-luna-flex]
    value:
      providers: [codex-value]
    smart:
      providers: [codex-smart]
  forge:
    provider: github
    repository: AnthusAI/Kanbus
    base_branch: develop
    api_url: https://api.github.com
    token_env: GITHUB_TOKEN
  watch_interval: 30s
  retries:
    max_attempts: 3

# Snyk vulnerability synchronization (optional). Secrets go in .env, not here.
# snyk:
#   org_id: <uuid from app.snyk.io/org/<slug>/manage/settings>
#   min_severity: high          # critical | high | medium | low (default: low)
#   parent_epic: <kanbus-id>    # optional: attach imported bugs under this epic

# GitHub security synchronization (optional). Secrets go in .env, not here.
# github_security:
#   repo: owner/repo            # optional: defaults from git remote origin
#   dependabot:
#     min_severity: high        # critical | high | medium | low (default: low)
#     state: open               # open | fixed | dismissed | auto_dismissed (default: open)
#     parent_epic: <kanbus-id>  # optional: attach imported findings under this epic

# Jira synchronization (optional). Secrets go in .env, not here.
jira:
  url: https://equity.atlassian.net
  project_key: AQA
  sync_direction: pull          # pull | push | both
  type_mappings:                # Jira issue type name → Kanbus issue type
    Story: story
    Bug: bug
    Task: task
    Workstream: epic
    Sub-task: sub-task

