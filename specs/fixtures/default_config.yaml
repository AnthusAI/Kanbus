prefix: "kanbus"
hierarchy:
  - initiative
  - epic
  - task
  - sub-task
types:
  - bug
  - story
  - chore
workflows:
  default:
    backlog: [open, closed]
    open: [in_progress, closed, backlog]
    in_progress: [open, blocked, closed]
    blocked: [in_progress, closed]
    closed: [open]
  epic:
    open: [in_progress, closed]
    in_progress: [open, closed]
    closed: [open]
initial_status: open
priorities:
  0: critical
  1: high
  2: medium
  3: low
  4: trivial
default_priority: 2
beads_compatibility: false
coordination:
  providers: [git]
  contention_window: "5s"
  default_lease_ttl: "300s"
  mutex_api:
    endpoint: null
    bearer_token: null
