[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanbus"
version = "0.22.0"
description = "A git-backed project management system."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click==8.4.2",
    "jinja2",
    "pydantic",
    "pyyaml",
    "pydantic-settings",
    "requests",
    "paho-mqtt",
    "behave",
    "pytest",
    "gherkin-official",
    "coverage",
    "ruff==0.15.5",
    "black==26.3.1",
    "sphinx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://kanb.us"
Repository = "https://github.com/AnthusAI/Kanbus"
Issues = "https://github.com/AnthusAI/Kanbus/issues"

[project.scripts]
kanbus = "kanbus.cli:cli"
# Keep a compatibility alias for users expecting the rust binary name
kanbusr = "kanbus.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.semantic_release]
# 2026-08-29 Dependabot paydown (#173): patch release. chore(deps) does not bump.
version_toml = [
    "pyproject.toml:project.version",
    "../rust/Cargo.toml:package.version",
]
version_variables = ["src/kanbus/__init__.py:__version__"]
tag_format = "kanbus-py-{version}"
changelog_file = "CHANGELOG.md"
build_command = "cargo update --manifest-path ../rust/Cargo.toml -p kanbus --precise $NEW_VERSION && git add ../rust/Cargo.lock && python -m build"
allow_zero_version = true
major_on_zero = false
