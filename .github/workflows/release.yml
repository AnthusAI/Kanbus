name: Release

on:
  push:
    tags:
      - "kanbus-py-*"
      - "kanbus-rust-*"
      - "ui-v*"
      - "api-client-v*"
      - "kanbus-cdk-v*"
  workflow_dispatch:
    inputs:
      pypi_only:
        description: "Run only the PyPI release job"
        required: false
        type: boolean
        default: true
      rust_only:
        description: "Publish Rust crate and binaries for an existing tag (skip PyPI)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  ui-package:
    name: Shared UI package
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'ui-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Verify tag and shared behavior
        working-directory: packages/ui
        run: |
          test "ui-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish immutable UI artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#ui-v}"
          artifact="$RUNNER_TEMP/kanbus-ui-${version}.tgz"
          sha256sum "$artifact"
          gh release create "$GITHUB_REF_NAME" "$artifact" --title "@kanbus/ui ${version}" --notes "Shared Kanbus board, configured type filter, organizer theme, four editorial board themes and accessible detail components. Built and behavior-tested from this tag. Consumers own data, authentication and routing." --latest=false

  api-client-package:
    name: API client package
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'api-client-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Verify tag and client behavior
        working-directory: packages/api-client
        run: |
          test "api-client-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npm ci
          npm test
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish immutable API client artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#api-client-v}"
          artifact="$RUNNER_TEMP/kanbus-api-client-${version}.tgz"
          sha256sum "$artifact"
          gh release create "$GITHUB_REF_NAME" "$artifact" --title "@kanbus/api-client ${version}" --notes "Typed TypeScript client for the Kanbus writable application API. Built and tested from this tag. Consumers own authentication and signing." --latest=false

  cdk-package:
    name: CDK construct package
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'kanbus-cdk-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' services/kanbus-api/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain and zip
        run: sudo apt-get update && sudo apt-get install -y musl-tools zip
      - name: Verify tag matches package version
        working-directory: packages/cdk
        run: test "kanbus-cdk-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build the x86_64 Lambda packages
        working-directory: services/kanbus-api
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin kanbus-api-lambda --bin kanbus-api-sweeper --features aws
          for binary in kanbus-api-lambda kanbus-api-sweeper; do
            mkdir -p "$RUNNER_TEMP/$binary"
            cp "${CARGO_TARGET_DIR:-target}/x86_64-unknown-linux-musl/release/$binary" "$RUNNER_TEMP/$binary/bootstrap"
            chmod 755 "$RUNNER_TEMP/$binary/bootstrap"
            (cd "$RUNNER_TEMP/$binary" && zip -X "$binary.zip" bootstrap)
          done
      - name: Test the construct without the bundled package
        working-directory: packages/cdk
        run: |
          npm ci
          npm test
      - name: Bundle the Lambda packages and pack the construct
        working-directory: packages/cdk
        run: |
          mkdir -p assets
          cp "$RUNNER_TEMP/kanbus-api-lambda/kanbus-api-lambda.zip" assets/kanbus-api-lambda.zip
          cp "$RUNNER_TEMP/kanbus-api-sweeper/kanbus-api-sweeper.zip" assets/kanbus-api-sweeper.zip
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish immutable CDK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#kanbus-cdk-v}"
          artifact="$RUNNER_TEMP/kanbus-cdk-${version}.tgz"
          tar -tzf "$artifact" | grep -q "package/assets/kanbus-api-lambda.zip"
          tar -tzf "$artifact" | grep -q "package/assets/kanbus-api-sweeper.zip"
          sha256sum "$artifact" packages/cdk/assets/kanbus-api-lambda.zip packages/cdk/assets/kanbus-api-sweeper.zip
          gh release create "$GITHUB_REF_NAME" "$artifact" packages/cdk/assets/kanbus-api-lambda.zip packages/cdk/assets/kanbus-api-sweeper.zip --title "@kanbus/cdk ${version}" --notes "CDK construct that deploys the Kanbus API service. The tarball bundles the x86_64 API and sweeper Lambda packages built from this tag, so construct and service versions match." --latest=false

  pypi-release:
    name: PyPI Release
    # Run for python release tags, or manual dispatch when rust_only is not set.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'kanbus-py-')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.rust_only == '') }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build artifacts
        working-directory: python
        run: python -m build

      - name: Check release artifacts
        id: release_ready
        working-directory: python
        run: |
          if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require package version to match release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "kanbus-py-$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packaged version $version" >&2
            exit 1
          fi

      - name: Publish release to PyPI
        working-directory: python
        if: ${{ steps.release_ready.outputs.release_ready == 'true' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          ls -la dist
          twine upload --skip-existing dist/*

      - name: Verify PyPI release
        working-directory: python
        if: ${{ steps.release_ready.outputs.release_ready == 'true' }}
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]

          url = "https://pypi.org/pypi/kanbus/json"
          deadline = time.time() + 120
          while True:
              with urllib.request.urlopen(url, timeout=10) as response:
                  payload = json.load(response)
              releases = payload.get("releases", {})
              if version in releases:
                  print(f"PyPI now shows kanbus {version}.")
                  break
              if time.time() >= deadline:
                  raise SystemExit(f"PyPI did not show kanbus {version} within 120s.")
              print(f"Waiting for PyPI to show kanbus {version}...")
              time.sleep(10)
          PY

      - name: Capture release tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.rust_only }}" ]; then
            echo "tag=${{ github.event.inputs.rust_only }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.release_ready.outputs.release_ready }}" = "true" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
            if [ "$GITHUB_REF_NAME" != "kanbus-py-$version" ]; then
              echo "Requested tag does not match the packaged Python version" >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  rust-binaries:
    needs: pypi-release
    if: ${{ needs.pypi-release.outputs.release_tag != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event.inputs.pypi_only != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: kbs
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: kbs
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            binary: kbs
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: kbs.exe
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Build binary
        run: |
          cd rust
          cargo build --release --target ${{ matrix.target }} --bin kbs

      - name: Package binary (tar.gz)
        if: ${{ matrix.archive == 'tar.gz' }}
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/kbs
          tar -czf dist/kbs-${{ matrix.target }}.tar.gz -C dist kbs

      - name: Package binary (zip)
        if: ${{ matrix.archive == 'zip' && matrix.os != 'windows-latest' }}
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/kbs.exe
          cd dist
          zip kbs-${{ matrix.target }}.zip kbs.exe

      - name: Package binary (zip, windows)
        if: ${{ matrix.archive == 'zip' && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/kbs.exe"
          Compress-Archive -Path "dist/kbs.exe" -DestinationPath "dist/kbs-${{ matrix.target }}.zip" -Force

      - name: Upload release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ needs.pypi-release.outputs.release_tag }}
          files: |
            dist/kbs-${{ matrix.target }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  console-server-binaries:
    needs: pypi-release
    if: ${{ needs.pypi-release.outputs.release_tag != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event.inputs.pypi_only != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: kbsc
            archive: tar.gz
            vscode-target: linux-x64
          - os: macos-14
            target: aarch64-apple-darwin
            binary: kbsc
            archive: tar.gz
            vscode-target: darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            binary: kbsc
            archive: tar.gz
            vscode-target: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: kbsc.exe
            archive: zip
            vscode-target: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build shared UI package
        run: |
          cd packages/ui
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/console/package-lock.json

      - name: Build frontend assets
        run: |
          cd apps/console
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Build console server
        run: |
          cd rust
          cargo build --release --target ${{ matrix.target }} --bin kbsc --features embed-assets

      - name: Package console server (tar.gz)
        if: ${{ matrix.archive == 'tar.gz' }}
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/kbsc
          tar -czf dist/kbsc-${{ matrix.target }}.tar.gz -C dist kbsc

      - name: Package console server (zip)
        if: ${{ matrix.archive == 'zip' && matrix.os != 'windows-latest' }}
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/kbsc.exe
          cd dist
          zip kbsc-${{ matrix.target }}.zip kbsc.exe

      - name: Package console server (zip, windows)
        if: ${{ matrix.archive == 'zip' && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/kbsc.exe"
          Compress-Archive -Path "dist/kbsc.exe" -DestinationPath "dist/kbsc-${{ matrix.target }}.zip" -Force

      - name: Upload kbsc artifact for VSCode extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kbsc-${{ matrix.vscode-target }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload console server assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ needs.pypi-release.outputs.release_tag }}
          files: |
            dist/kbsc-${{ matrix.target }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vscode-extension:
    name: Publish VSCode Extension
    needs: [pypi-release, console-server-binaries]
    if: ${{ needs.pypi-release.outputs.release_tag != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.pypi_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: apps/vscode

      - name: Compile TypeScript
        run: npm run compile
        working-directory: apps/vscode

      - name: Download all kbsc binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: apps/vscode/artifacts
          pattern: kbsc-*

      - name: Package extension for each platform
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64; do
            mkdir -p bin
            cp artifacts/kbsc-$target/kbsc bin/kbsc
            chmod +x bin/kbsc
            ./node_modules/.bin/vsce package --target $target
          done
          mkdir -p bin
          cp artifacts/kbsc-win32-x64/kbsc.exe bin/kbsc.exe
          ./node_modules/.bin/vsce package --target win32-x64
        working-directory: apps/vscode

      - name: Publish all platform packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set; skipping VSCode Marketplace publish."
            exit 0
          fi
          ./node_modules/.bin/vsce publish --packagePath *.vsix
        working-directory: apps/vscode

  rust-crate:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'kanbus-rust-')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.rust_only != '') }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Checkout requested Rust tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.rust_only }}"
          tag="${tag#refs/tags/}"
          case "$tag" in
            kanbus-rust-*) ;;
            v*) tag="kanbus-rust-${tag#v}" ;;
            *) tag="kanbus-rust-${tag}" ;;
          esac
          git fetch --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "${tag}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            packages/ui/package-lock.json
            apps/console/package-lock.json

      - name: Build shared UI package
        working-directory: ${{ github.workspace }}/packages/ui
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Build console frontend assets
        working-directory: ${{ github.workspace }}/apps/console
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Sync console assets into Rust bundle
        run: |
          rm -rf rust/embedded_assets/console
          mkdir -p rust/embedded_assets
          cp -R apps/console/dist rust/embedded_assets/console

      - name: Verify console assets bundled for crate
        run: |
          test -f rust/embedded_assets/console/index.html
          (cd rust && cargo package --locked --allow-dirty --list) | grep -Eq '^embedded_assets/console/index.html$'
          (cd rust && cargo package --locked --allow-dirty --list) | grep -Eq '^testdata/mock_board_screenshot.png$'

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Verify crate version matches release tag
        working-directory: rust
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_version="${{ github.event.inputs.rust_only }}"
          else
            tag_version="${{ github.ref_name }}"
          fi
          tag_version="${tag_version#refs/tags/}"
          tag_version="${tag_version#kanbus-rust-}"
          tag_version="${tag_version#v}"
          if [ -z "$tag_version" ]; then
            echo "Release tag did not include a crate version" >&2
            exit 1
          fi
          manifest_version="$(python - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Cargo.toml version ${manifest_version} does not match release tag version ${tag_version}" >&2
            exit 1
          fi
          echo "Cargo.toml version matches release tag: ${tag_version}"

      - name: fmt
        working-directory: rust
        run: cargo fmt --check

      - name: clippy
        working-directory: rust
        run: cargo clippy --locked -- -D warnings

      - name: test
        working-directory: rust
        run: cargo test --locked

      - name: package (verification)
        working-directory: rust
        run: cargo package --locked --allow-dirty

      - name: Check if crate version already exists
        id: crate_version_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.rust_only }}"
          else
            version="${{ github.ref_name }}"
          fi
          version="${version#refs/tags/}"
          version="${version#kanbus-rust-}"
          version="${version#v}"
          python - <<'PY' "$version"
          import json
          import os
          import sys
          import urllib.request

          version = sys.argv[1]
          url = "https://crates.io/api/v1/crates/kanbus"
          exists = True
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  payload = json.load(response)
              versions = payload.get("versions", [])
              exists = any(entry.get("num") == version for entry in versions)
              print(f"crate version {version} exists: {exists}")
          except Exception as exc:
              print(f"skipping publish: could not verify version on crates.io ({exc})")

          output_path = os.environ.get("GITHUB_OUTPUT")
          if not output_path:
              print("GITHUB_OUTPUT not set; skipping publish")
              sys.exit(0)
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"publish={'false' if exists else 'true'}\n")
          PY

      - name: publish
        if: ${{ steps.crate_version_check.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: rust
        run: cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
