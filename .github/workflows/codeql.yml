name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "26 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9792ccaef0455e446c567163589397e8c3ac2e0d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Rust toolchain
        if: matrix.language == 'rust' && matrix.build-mode == 'manual'
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0

      - name: Build Rust project for CodeQL
        if: matrix.language == 'rust' && matrix.build-mode == 'manual'
        run: |
          cd rust
          cargo build --workspace --all-targets --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9792ccaef0455e446c567163589397e8c3ac2e0d # v3
