project_directory: project
project_key: kanbus
console_port: 5174

hierarchy:
  - initiative
  - epic
  - task
  - sub-task
types:
  - bug
  - story
  - chore
  - event

workflows:
  default:
    backlog: [open, closed]
    open: [in_progress, closed, backlog]
    in_progress: [open, blocked, closed, backlog]
    blocked: [in_progress, closed, backlog]
    closed: [open, backlog]
    Discovery: [open, backlog]
    done: [open, backlog]
    todo: [open, backlog]
    deferred: [open, backlog]
  epic:
    open: [in_progress, closed, done]
    in_progress: [open, closed, done]
    closed: [open]
    done: [open]
  story:
    backlog: [open, closed]
    open: [copy_writing, in_progress, closed, backlog]
    copy_writing: [open, in_progress, closed, backlog]
    in_progress: [open, blocked, closed, copy_writing, backlog]
    blocked: [in_progress, closed, backlog]
    closed: [open, backlog]
    Discovery: [open, backlog]

statuses:
  - key: backlog
    name: Backlog
    category: To do
    semantic_category: todo
    collapsed: true
  - key: todo
    name: Todo (Legacy)
    category: To do
    semantic_category: todo
    collapsed: true
  - key: Discovery
    name: Discovery
    category: To do
    semantic_category: todo
    collapsed: false
  - key: open
    name: Ready
    category: To do
    semantic_category: todo
  - key: copy_writing
    name: Copy Writing
    category: In progress
    semantic_category: in_progress
  - key: in_progress
    name: In Progress
    category: In progress
    semantic_category: in_progress
  - key: blocked
    name: Blocked
    category: In progress
    semantic_category: in_progress
    collapsed: true
  - key: deferred
    name: Deferred (Legacy)
    category: To do
    semantic_category: todo
    collapsed: true
  - key: closed
    name: Done
    category: Done
    semantic_category: done
    collapsed: true
  - key: done
    name: Done (Legacy)
    category: Done
    semantic_category: done
    collapsed: true

categories:
  - name: To do
    color: grey
  - name: In progress
    color: blue
  - name: Done
    color: green

transition_labels:
  default:
    backlog:
      open: Start discovery
      closed: Drop
    open:
      in_progress: Start work
      closed: Drop
      backlog: Back to backlog
    in_progress:
      open: Pause
      blocked: Block
      closed: Complete
      backlog: Back to backlog
    blocked:
      in_progress: Unblock
      closed: Drop
      backlog: Back to backlog
    closed:
      open: Reopen
      backlog: Back to backlog
    Discovery:
      open: Start work
      backlog: Back to backlog
    done:
      open: Reopen
      backlog: Back to backlog
    todo:
      open: Start work
      backlog: Back to backlog
    deferred:
      open: Resume
      backlog: Back to backlog
  epic:
    open:
      in_progress: Start
      closed: Complete
      done: Complete
    in_progress:
      open: Pause
      closed: Complete
      done: Complete
    closed:
      open: Reopen
    done:
      open: Reopen
  story:
    backlog:
      open: Start
      closed: Drop
    open:
      copy_writing: Start copy
      in_progress: Start work
      closed: Complete
      backlog: Back to backlog
    copy_writing:
      open: Pause
      in_progress: Send to production
      closed: Complete
      backlog: Back to backlog
    in_progress:
      open: Pause
      blocked: Block
      closed: Complete
      copy_writing: Back to copy
      backlog: Back to backlog
    blocked:
      in_progress: Unblock
      closed: Drop
      backlog: Back to backlog
    closed:
      open: Reopen
      backlog: Back to backlog
    Discovery:
      open: Start work
      backlog: Back to backlog

initial_status: open
priorities:
  0:
    name: critical
    color: red
  1:
    name: high
    color: bright_red
  2:
    name: medium
    color: yellow
  3:
    name: low
    color: blue
  4:
    name: trivial
    color: white
default_priority: 2

type_colors:
  initiative: bright_blue
  epic: magenta
  task: blue
  sub-task: bright_cyan
  bug: red
  story: yellow
  chore: green
  event: bright_blue

beads_compatibility: false
