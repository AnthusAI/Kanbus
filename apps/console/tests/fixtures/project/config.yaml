prefix: kanbus
# Legacy Taskulus-era snapshot for local reference only. The console Playwright
# suite loads apps/console/tests/fixtures/kanbus.board-columns.yml via
# scripts/run_ui_tests.ts (merged at tempDir/.kanbus.yml for kbsc snapshots).
hierarchy:
- initiative
- epic
- task
- sub-task
types:
- bug
- story
- chore
workflows:
  default:
    backlog:
    - open
    - closed
    open:
    - in_progress
    - closed
    - backlog
    in_progress:
    - open
    - blocked
    - closed
    blocked:
    - in_progress
    - closed
    closed:
    - open
  epic:
    open:
    - in_progress
    - closed
    in_progress:
    - open
    - closed
    closed:
    - open
initial_status: open
priorities:
  0: critical
  1: high
  2: medium
  3: low
  4: trivial
default_priority: 2
